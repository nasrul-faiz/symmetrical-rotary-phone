<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FamilyMart.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Professional route planning and calendar management application for delivery services" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Dbrutals" />
    <meta name="application-name" content="Dbrutals" />
    <meta name="msapplication-TileColor" content="#131a2c" />
    <meta name="msapplication-TileImage" content="/FamilyMart.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Map tile host warm-up (OSM + Google Streets/Satellite) -->
    <link rel="dns-prefetch" href="//tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//mt0.google.com" />
    <link rel="dns-prefetch" href="//mt1.google.com" />
    <link rel="dns-prefetch" href="//mt2.google.com" />
    <link rel="dns-prefetch" href="//mt3.google.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://mt0.google.com" crossorigin />
    <link rel="preconnect" href="https://mt1.google.com" crossorigin />
    <link rel="preconnect" href="https://mt2.google.com" crossorigin />
    <link rel="preconnect" href="https://mt3.google.com" crossorigin />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/FamilyMart.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/FamilyMart.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/FamilyMart.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/FamilyMart.png" />
    
    <title>Dbrutals - Route & Calendar Management</title>



    <script>
      // Apply stored color mode + browser theme color before React mounts.
      (function() {
        const stored = localStorage.getItem('colorMode');
        const mode = (stored === 'light' || stored === 'dark')
          ? stored
          : 'light';
        const isDark = mode === 'dark';
        const resolved = isDark ? 'dark' : 'light';

        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('fcalendar_color_mode', resolved);

        const tabColor = isDark ? '#0b1020' : '#f4f7fb';
        const tileColor = isDark ? '#131a2c' : '#e8eef7';
        const statusBar = isDark ? 'black' : 'default';
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', tabColor);

        const tileMeta = document.querySelector('meta[name="msapplication-TileColor"]');
        if (tileMeta) tileMeta.setAttribute('content', tileColor);

        const appleStatusBarMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (appleStatusBarMeta) appleStatusBarMeta.setAttribute('content', statusBar);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
